<!doctype html>
<html lang="en">

<head>
  <title>My portfolios | Portfolio Maker</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
</head>

<body>
  <header class="bar"><a class="brand" href="index.html">Portfolio Maker</a>
    <nav id="nav"></nav>
  </header>
  <main class="wrap wide">
    <h1>My portfolios</h1>
    <p><a class="btn" href="form.html">Create portfolio</a></p>
    <p id="msg" role="status"></p>
    <div class="cards" id="list"></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/app.js"></script>
  <script src="js/site.js"></script>
  <script>
    (async () => {
      if (!await requireAuth()) return;
      const { data, error } = await sb.from('portfolios').select('id,full_name,selected_template,created_at').order('created_at', { ascending: false });
      if (error) { $('#msg').className = 'err'; $('#msg').textContent = error.message; return; }
      if (!data.length) { $('#list').innerHTML = '<p class="empty">No portfolios yet. Select Create portfolio to make your first one.</p>'; return; }
      $('#list').innerHTML = data.map(p => `<div class="card" id="c-${p.id}"><div class="mini m${p.selected_template}"></div><h2>${esc(p.full_name)}</h2><p>${TNAMES[p.selected_template]} template</p>
  <div class="acts"><a class="btn sm" href="preview.html?id=${p.id}">View</a><a class="btn ghost sm" href="form.html?id=${p.id}">Edit</a><button class="btn danger sm" data-del="${p.id}">Delete</button></div></div>`).join('');
      $('#list').onclick = async e => {
        const d = e.target.dataset.del; if (!d || !confirm('Delete this portfolio? This cannot be undone.')) return;
        const { error } = await sb.from('portfolios').delete().eq('id', d);
        if (error) { $('#msg').className = 'err'; $('#msg').textContent = error.message; return; }
        $('#c-' + d).remove(); $('#msg').textContent = 'Portfolio deleted.';
      };
    })();
  </script>
</body>

</html>
