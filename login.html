<!doctype html>
<html lang="en">

<head>
    <title>Log in | Portfolio Maker</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
</head>

<body>
    <header class="bar"><a class="brand" href="index.html">Portfolio Maker</a>
        <nav id="nav"></nav>
    </header>
    <main class="wrap" style="max-width:420px">
        <h1 id="t">Log in</h1>
        <form id="f"><label>Email<input type="email" id="em" required autocomplete="email"></label>
            <label>Password<input type="password" id="pw" required minlength="6"
                    autocomplete="current-password"></label>
            <p id="msg" role="status"></p><button class="btn" id="go">Log in</button>
            <p><a href="#" id="sw">No account yet? Sign up</a></p>
        </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="js/app.js"></script>
    <script src="js/site.js"></script>
    <script>
        let up = false; nav(null);
        const next = qs.get('next'), dest = next && /^[\w.\-?=&%]+$/.test(next) ? next : 'manage.html';
        session().then(s => { if (s) location.href = dest });
        $('#sw').onclick = e => { e.preventDefault(); up = !up; $('#t').textContent = up ? 'Sign up' : 'Log in'; $('#go').textContent = up ? 'Create account' : 'Log in'; e.target.textContent = up ? 'Have an account? Log in' : 'No account yet? Sign up' };
        $('#f').onsubmit = async e => {
            e.preventDefault(); const m = $('#msg'); m.className = ''; m.textContent = 'Please wait...';
            const c = { email: $('#em').value, password: $('#pw').value };
            const { data, error } = up ? await sb.auth.signUp(c) : await sb.auth.signInWithPassword(c);
            if (error) { m.className = 'err'; m.textContent = error.message; return }
            if (data.session) location.href = dest; else m.textContent = 'Account created. Check your email to confirm it, then log in.'
        };
    </script>
</body>

</html>
